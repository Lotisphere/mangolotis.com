<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="copyright" content="(c) 2026 Mangolotis. All rights reserved.">
<meta name="robots" content="noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WEFISHING · a tiny town for Haru Fishing</title>
<meta name="description" content="In an idle moment of surfing the internet, drop your idea, go fishing, and see it appear in the game. Meet others and build the fishing town together.">
<meta property="og:title" content="WEFISHING">
<meta property="og:description" content="Drop an idea, go fishing, and see it appear in the game.">
<meta property="og:image" content="https://www.mangolotis.com/wefishing_icon.jpg">
<meta name="theme-color" content="#2a2747">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ui/rod.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF4DF; --sand: #F3DDB3; --caramel: #C99A63; --cocoa: #5C3A21; --navy: #15243D;
    --lagoon: #1C8FA3; --mango: #F5B82E; --coral: #F2744B;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a14; color: var(--cocoa);
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; touch-action: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  /* ---- HUD ---- */
  .hud { position: fixed; z-index: 5; display: flex; gap: 10px; align-items: flex-start; opacity: 0; transition: opacity 1.6s ease 1.2s; }
  body.entered .hud { opacity: 1; }
  #hudL { top: 14px; left: 14px; flex-direction: column; }
  #hudR { top: 14px; right: 14px; }
  .badge { width: 60px; height: 60px; border: 0; padding: 0; background: center/contain no-repeat; cursor: pointer; position: relative;
    transition: transform .3s var(--spring); filter: drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
  .badge:hover { transform: scale(1.1) rotate(-4deg); }
  .badge:active { transform: scale(.92); }
  .badge.bump { animation: bump .7s var(--spring); }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1); } }
  #discord { background-image: url(ui/discord.svg); display: block; }
  #star { background-image: url(ui/star.svg); }
  #music { background-image: url(ui/note.svg); }
  #starCount { position: absolute; right: -2px; bottom: 2px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px;
    background: var(--coral); color: var(--cream); font: 700 13px/22px 'Zen Maru Gothic'; box-shadow: 2px 2px 0 var(--navy); }
  .tip { position: absolute; left: 70px; top: 16px; white-space: nowrap; background: var(--cream); color: var(--cocoa); font-size: 13px; font-weight: 700;
    padding: 5px 12px; border-radius: 12px; box-shadow: 3px 3px 0 var(--navy); opacity: 0; transform: translateX(-6px); transition: .25s; pointer-events: none; }
  #hudL a:hover .tip { opacity: 1; transform: none; }

  @keyframes breathe { 50% { opacity: .55; } }

  /* ---- XP bar (bottom centre) ---- */
  #xp { position: fixed; left: 50%; bottom: 14px; z-index: 5; display: flex; align-items: center; gap: 6px; transform: translateX(-50%);
    opacity: 0; transition: opacity 1.6s ease 1.4s; pointer-events: none; --bw: 304px; }
  body.entered #xp { opacity: 1; }
  #xp .bar { position: relative; width: var(--bw); height: calc(var(--bw) / 8); background: url(ui/xp_frame.svg) center/100% 100% no-repeat; }
  #xp .groove { position: absolute; left: 4.06%; top: 30%; width: 91.25%; height: 35%; }
  #xpClip { height: 100%; width: 0; overflow: hidden; border-radius: 999px; transition: width .9s cubic-bezier(.22, 1, .36, 1);
    background: url(ui/xp_fill.svg) left center / calc(var(--bw) * 0.9125) 100% no-repeat; }
  #xpText { position: absolute; right: 8%; top: 100%; margin-top: 1px; font: 12px 'DotGothic16', monospace; color: var(--cream); text-shadow: 1px 1px 0 var(--navy); }
  #xp.up .bar { animation: glowbar 1.2s ease; }
  @keyframes glowbar { 30% { filter: drop-shadow(0 0 8px rgba(245,184,46,.9)); } }
  .float { position: fixed; z-index: 4; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
    font: 13px 'DotGothic16', monospace; color: var(--cream); text-shadow: 1px 1px 0 var(--navy), -1px 0 0 var(--navy), 0 -1px 0 var(--navy);
    animation: rise 2.3s ease-out forwards; }
  .float.t2, .float.t3 { color: var(--mango); font-size: 15px; }
  @keyframes rise { 0% { opacity: 0; margin-top: 6px; } 12% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }

  /* ---- fishing button + chip (follow the player) ---- */
  #fishBtn, #chip { position: fixed; left: 0; top: 0; z-index: 4; }
  #fishBtn { border: 0; cursor: pointer; padding: 0; background: none; pointer-events: none; }
  #fishBtn .in { display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 26px 7px 14px; color: var(--cream); font: 700 17px 'Zen Maru Gothic';
    background: url(ui/btn_normal.svg) center/100% 100% no-repeat; transform: scale(.4) translateY(14px); opacity: 0; transition: transform .35s var(--spring), opacity .2s; white-space: nowrap; }
  #fishBtn .in img { width: 34px; height: 34px; }
  #fishBtn.show { pointer-events: auto; }
  #fishBtn.show .in { transform: none; opacity: 1; animation: float 2.4s ease-in-out infinite .4s; }
  #fishBtn:hover .in { background-image: url(ui/btn_hover.svg); }
  #fishBtn:active .in { background-image: url(ui/btn_pressed.svg); padding-top: 6px; padding-bottom: 0; }
  @keyframes float { 50% { margin-top: -5px; } }
  #chip { pointer-events: none; }
  #chip .in { font-family: 'DotGothic16', monospace; font-size: 15px; color: var(--cocoa); padding: 10px 22px 14px; white-space: nowrap;
    background: url(ui/chip.svg) center/100% 100% no-repeat; opacity: 0; transform: scale(.5); transition: .3s var(--spring); }
  #chip.show .in { opacity: 1; transform: none; }

  /* ---- panels ---- */
  .panel { background: url(ui/panel.svg) center/100% 100% no-repeat; padding: 40px 46px 46px 40px; }
  #ideaPanel { position: fixed; left: 50%; bottom: 7vh; z-index: 6; width: min(560px, calc(100vw - 20px)); transform: translate(-50%, 130%) scale(.8);
    opacity: 0; transition: transform .7s var(--spring), opacity .3s; pointer-events: none; }
  #ideaPanel.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #ideaPanel.shake { animation: shake .4s; }
  @keyframes shake { 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
  #ideaTitle { margin: 0 0 6px; font-size: 21px; line-height: 1.4; }
  #ideaTitle b { color: var(--lagoon); }
  #ideaNote { margin: 0 0 14px; font-size: 13px; color: #8a6a4c; line-height: 1.5; }
  #ideaText { width: 100%; height: 96px; resize: none; border: 2px dashed var(--caramel); border-radius: 14px; background: #fffaf0; padding: 12px 14px;
    font: 500 16px 'Zen Maru Gothic', sans-serif; color: var(--cocoa); outline: none; user-select: text; }
  #ideaText:focus { border-color: var(--lagoon); background: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  #count { font-size: 12px; color: #a88a6c; }
  #ideaMsg { flex-basis: 100%; min-height: 0; font-size: 13px; color: #d6405e; }
  #ideaMsg:empty { display: none; }
  #laterBtn { border: 0; background: none; color: #a88a6c; font: 500 14px 'Zen Maru Gothic'; cursor: pointer; text-decoration: underline dotted; }
  .sbtn { border: 0; height: 56px; padding: 0 30px 7px; color: var(--cream); font: 700 17px 'Zen Maru Gothic'; cursor: pointer;
    background: url(ui/btn_normal.svg) center/100% 100% no-repeat; transition: transform .25s var(--spring); }
  .sbtn:hover { background-image: url(ui/btn_hover.svg); transform: translateY(-2px); }
  .sbtn:active { background-image: url(ui/btn_pressed.svg); padding-top: 6px; padding-bottom: 0; transform: none; }
  .sbtn:disabled { opacity: .6; cursor: wait; }

  #toast { position: fixed; left: 50%; top: 18px; z-index: 7; width: min(520px, calc(100vw - 24px)); display: flex; gap: 14px; align-items: center;
    background: url(ui/panel_wide.svg) center/100% 100% no-repeat; padding: 24px 34px 30px 26px; transform: translate(-50%, -140%); transition: transform .8s var(--spring); cursor: pointer; }
  #toast.show { transform: translate(-50%, 0); }
  #toastIcon { width: 58px; height: 58px; flex: none; }
  #toastTitle { margin: 0; font-size: 17px; line-height: 1.4; }
  #toastTitle b { color: var(--lagoon); }
  #toastSub { margin: 4px 0 0; font-size: 13px; color: #8a6a4c; line-height: 1.5; max-height: 6em; overflow: hidden; }
  #toastSub:empty { display: none; }

  #starPanel { position: fixed; right: 12px; top: 96px; bottom: 16px; z-index: 6; width: min(340px, calc(100vw - 24px));
    background: url(ui/panel_tall.svg) center/100% 100% no-repeat; padding: 30px 30px 40px 24px; display: flex; flex-direction: column;
    transform: translateX(115%); transition: transform .6s var(--spring); }
  #starPanel.show { transform: none; }
  #musicPanel { position: fixed; right: 12px; top: 84px; z-index: 6; width: min(330px, calc(100vw - 24px)); background: url(ui/panel_wide.svg) center/100% 100% no-repeat;
    padding: 26px 34px 34px 26px; transform: translateX(115%); transition: transform .6s var(--spring); }
  #musicPanel.show { transform: none; }
  #musicPanel h3 { margin: 4px 0 8px; font-size: 18px; }
  #musicPanel .x { position: absolute; right: 34px; top: 22px; border: 0; background: none; font-size: 20px; color: var(--caramel); cursor: pointer; }
  #trackList { list-style: none; margin: 0; padding: 0; }
  #trackList li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 12px; cursor: pointer; font-size: 14px; transition: background .2s; }
  #trackList li:hover { background: rgba(243,221,179,.7); }
  #trackList li .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--caramel); flex: none; }
  #trackList li.on .dot { background: var(--lagoon); border-color: var(--cocoa); box-shadow: 0 0 0 2px rgba(28,143,163,.25); }
  #trackList li.on .tn { font-weight: 700; color: var(--lagoon); }
  #trackList li small { color: #a88a6c; font-size: 11px; }
  #trackList li.locked { cursor: default; opacity: .55; }
  #trackList li.locked:hover { background: none; }
  #trackList li .lk { flex-basis: 100%; padding-left: 20px; font-size: 11px; color: #a88a6c; }
  #layerBox { margin-top: 8px; padding-top: 10px; border-top: 2px dashed rgba(201,154,99,.45); }
  #layersLabel { display: block; font-size: 12px; font-weight: 700; color: #8a6a4c; margin-bottom: 6px; }
  #layers { display: flex; flex-wrap: wrap; gap: 6px; }
  #layers button, #langs button { border: 2px solid var(--caramel); background: var(--cream); color: #a88a6c; border-radius: 12px; padding: 2px 10px 3px;
    font: 500 12px 'Zen Maru Gothic', sans-serif; cursor: pointer; box-shadow: 2px 2px 0 rgba(21,36,61,.75); transition: transform .2s var(--spring); }
  #layers button:hover { transform: translateY(-2px); }
  #layers button.on { background: var(--lagoon); border-color: var(--cocoa); color: var(--cream); }
  #starPanel h3 { margin: 4px 0 10px; font-size: 18px; }
  #starClose { position: absolute; right: 30px; top: 26px; border: 0; background: none; font-size: 20px; color: var(--caramel); cursor: pointer; }
  #starList { list-style: none; margin: 0; padding: 0 6px 0 0; overflow-y: auto; flex: 1; user-select: text; }
  #starList li { padding: 10px 2px 12px; border-bottom: 2px dashed rgba(201,154,99,.45); }
  #starList li.empty { border: 0; color: #a88a6c; font-size: 14px; line-height: 1.6; }
  #starList p { margin: 4px 0; font-size: 14px; line-height: 1.55; word-break: break-word; }
  .who { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 8px; background: var(--sand); }
  .who.you { background: var(--mango); } .who.haru { background: #e6d7f7; }
  .st { font-size: 11px; color: var(--lagoon); }
  #keep { font-size: 11px; color: #a88a6c; margin: 8px 0 0; }
  #langBox { margin-top: 10px; padding-top: 10px; border-top: 2px dashed rgba(201,154,99,.45); }
  #langLabel { display: block; font-size: 12px; font-weight: 700; color: #8a6a4c; margin-bottom: 6px; }
  #langs { display: flex; flex-wrap: wrap; gap: 5px; }
  #langs button { border: 2px solid var(--caramel); background: var(--cream); color: var(--cocoa); border-radius: 12px; padding: 2px 9px 3px;
    font: 500 12px 'Zen Maru Gothic', sans-serif; cursor: pointer; box-shadow: 2px 2px 0 rgba(21,36,61,.75); transition: transform .2s var(--spring); }
  #langs button:hover { transform: translateY(-2px); }
  #langs button.on { background: var(--lagoon); border-color: var(--cocoa); color: var(--cream); }

  /* ---- welcome ---- */
  #welcome { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; cursor: pointer; }
  #welcome .card { width: min(460px, calc(100vw - 32px)); text-align: center; padding: 38px 40px 44px 34px;
    background: url(ui/panel_wide.svg) center/100% 100% no-repeat; transform: scale(.7) translateY(20px); opacity: 0;
    transition: transform 1s var(--spring), opacity .8s; }
  #welcome.show .card { transform: none; opacity: 1; }
  #welcome.hide .card, #welcome.soft .card { transform: scale(.92) translateY(-14px); opacity: 0; transition: transform .8s ease, opacity .7s; }
  #welcome.soft { pointer-events: none; }
  #welcomeTitle { margin: 0; font-size: 34px; letter-spacing: 2px; }
  #welcomeSub { margin: 8px 0 0; font-family: 'DotGothic16', monospace; font-size: 14px; color: #a88a6c; animation: breathe 2.6s ease-in-out infinite; }
  #welcomeStats { margin: 10px 0 0; font-size: 12px; color: #8a6a4c; }
  #welcomeStats:empty { display: none; }
  .spark { color: var(--mango); }

  @media (max-width: 700px) {
    #xp { --bw: 230px; bottom: 10px; }
    .badge { width: 50px; height: 50px; }
    #starPanel { top: 84px; }
    #ideaPanel { bottom: 2vh; }
    .panel { padding: 30px 32px 36px 28px; }
    #ideaTitle { font-size: 17px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div class="hud" id="hudL">
  <a id="discord" class="badge" target="_blank" rel="noopener noreferrer"><span class="tip" id="discordTip"></span></a>
</div>
<div class="hud" id="hudR">
  <button id="music" class="badge" aria-label="music"></button>
  <button id="star" class="badge" aria-label="ideas"><span id="starCount"></span></button>
</div>

<button id="fishBtn"><span class="in"><img src="ui/rod.svg" alt=""><span id="fishLabel"></span></span></button>
<div id="chip"><div class="in"></div></div>

<div id="ideaPanel" class="panel">
  <h2 id="ideaTitle"></h2>
  <p id="ideaNote"></p>
  <textarea id="ideaText" maxlength="300"></textarea>
  <div class="row">
    <span id="ideaMsg"></span>
    <span><button id="laterBtn"></button> <span id="count">0/300</span></span>
    <button id="sendBtn" class="sbtn"><span id="sendLabel"></span></button>
  </div>
</div>

<div id="toast"><img id="toastIcon" alt=""><div><p id="toastTitle"></p><p id="toastSub"></p></div></div>

<aside id="musicPanel" class="side">
  <button id="musicClose" class="x" aria-label="close">✕</button>
  <h3><span class="spark">♪</span> <span id="musicTitle"></span></h3>
  <ul id="trackList"></ul>
  <div id="layerBox"><span id="layersLabel"></span><div id="layers"><button data-bus="music"></button><button data-bus="amb"></button><button data-bus="sfx"></button></div></div>
</aside>

<aside id="starPanel">
  <button id="starClose" aria-label="close">✕</button>
  <h3><span class="spark">✦</span> <span id="starTitle"></span></h3>
  <ul id="starList"></ul>
  <div id="langBox"><span id="langLabel"></span><div id="langs"></div></div>
  <p id="keep"></p>
</aside>


<div id="xp"><div class="bar"><div class="groove"><div id="xpClip"></div></div><span id="xpText"></span></div></div>

<div id="welcome"><div class="card">
  <h1 id="welcomeTitle"></h1>
  <p id="welcomeSub"></p>
  <p id="welcomeStats"></p>
</div></div>

<noscript><p style="color:#fff;padding:2em">WEFISHING needs JavaScript and WebGL.</p></noscript>
<script type="module" src="js/wefishing.js?v=defa277965"></script>
</body>
</html>
